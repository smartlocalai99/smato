name: Build smato APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Every APK is signed with SMATO's permanent key
      # (android/signing/smato-release.p12): Android only installs an update
      # signed with the same key as the installed app, and QR setup checks
      # it. Refuse to build without the password rather than publish an APK
      # signed with a throwaway key.
      - name: Check the signing password
        env:
          SMATO_KEYSTORE_PASSWORD: ${{ secrets.SMATO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SMATO_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the SMATO_KEYSTORE_PASSWORD secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # :app is the kiosk tablet player; :tv is SMATO Ads, the plain TV
      # player (nothing locked), published as smato-tv.apk.
      - name: Build debug APKs
        working-directory: android
        env:
          SMATO_KEYSTORE_PASSWORD: ${{ secrets.SMATO_KEYSTORE_PASSWORD }}
        run: |
          gradle :app:assembleDebug :tv:assembleDebug --no-daemon
          cp tv/build/outputs/apk/debug/tv-debug.apk smato-tv.apk
          # What SMATO Ads checks to update itself (android/tv Updater.kt).
          code=$(grep -oE 'versionCode = [0-9]+' tv/build.gradle.kts | grep -oE '[0-9]+')
          printf '{"versionCode": %s}\n' "$code" > smato-tv.json
          cat smato-tv.json

      - uses: actions/upload-artifact@v4
        with:
          name: smato-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/smato-tv.apk

      - name: Publish to the "latest-apk" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-apk
          name: smato — latest build
          body: >
            Auto-built from the latest push to main. TVs: install smato-tv.apk
            (SMATO Ads, plays the ads, locks nothing). Tablets: install
            app-debug.apk.
          allowUpdates: true
          replacesArtifacts: true
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk,android/smato-tv.apk,android/smato-tv.json
          token: ${{ secrets.GITHUB_TOKEN }}
