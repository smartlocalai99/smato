name: Build smato APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Every runner starts clean, with no debug signing key on it. Without
      # this, Gradle generates a brand new one on every single build — so
      # every APK would be signed differently, and Android refuses to
      # install an "update" whose signature doesn't match what's already on
      # a tablet. Caching the keystore under a fixed key means the first
      # build after this change still gets a one-time new key (there's
      # nothing cached yet), but every build after that reuses the exact
      # same one, so updates install cleanly from then on.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: smato-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the "latest-apk" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-apk
          name: smato — latest build
          body: >
            Auto-built from the latest push to main. Download app-debug.apk
            below and install it on the tablet.
          allowUpdates: true
          replacesArtifacts: true
          artifacts: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
